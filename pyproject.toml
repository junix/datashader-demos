[project]
name = "datashader-demos"
version = "0.1.0"
description = "Validated large-data transparent PNG demos using Datashader"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "datashader>=0.19.1,<0.20",
    "numpy>=2.2",
    "pandas>=2.2",
    "pillow>=11",
]

[project.scripts]
datashader-demos = "datashader_demos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datashader_demos"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
